<body data-locked>
<!-- THESIS: the seller's workspace starts with their own business, not an agency demo.
OWN-WORLD: the existing paper-and-ink grid, Plus Jakarta Sans, and a single blue action.
STORY: sign in locally, choose personal or organization use, then name the business.
FIRST VIEWPORT: the P mark, a clear account heading, and a compact flush-left form.
FORM: a focused extension of the existing setup flow; no replacement visual identity. -->
<section id="access" class="access" aria-label="Local account"><p role="status">Opening local accounts...</p></section>
<aside class="rail">
  <div class="label">
  <div class="brand"><svg class="pmark" viewBox="0 0 304 383" width="24" height="30" aria-hidden="true"><rect width="87" height="383" rx="43.5" style="fill:var(--lg-stem,#2656D9)"/><path fill-rule="evenodd" style="fill:var(--lg-ring,#E22622)" d="M174 0a130 130 0 1 0 0 260a130 130 0 1 0 0-260ZM174 79a51 51 0 1 1 0 102a51 51 0 1 1 0-102Z"/><path style="fill:var(--lg-star,#FAC800)" d="M63 96C66 119 74 127 97 130C74 133 66 141 63 164C60 141 52 133 29 130C52 127 60 119 63 96Z"/></svg><div><b>PRIO</b><span class="eyebrow">Connect</span><a href="#company" class="as-company" id="as-company"></a></div></div>
  <a href="#new" class="new" id="nav-new">+ New prospect</a>
  <a href="#account" class="account-link">Account</a>
  <nav aria-label="Main">
    <a href="#home" data-tab="home">Home</a>
    <a href="#library" data-tab="library">Library <span class="count" id="kit-count"></span></a>
    <a href="#compare" data-tab="compare">Compare</a>
    <a href="#crm" data-tab="crm">Clients <span class="count due" id="crm-due" title="Follow-ups due today or late"></span></a>
        <a href="#crm/targets" data-tab="targets" class="sub">Find targets</a>
    <a href="#ads" data-tab="ads">Ads</a>
    <a href="#landing" data-tab="landing">Landing pages</a>
    <a href="#services" data-tab="services">Prio services</a>
    <a href="#brand" data-tab="brand">Brand kits</a>
    <a href="#company" data-tab="company">My company</a>
    <a href="#settings" data-tab="settings">Settings</a>
  </nav>
  </div>
  <a href="#run" class="running" id="running" hidden><span class="pulse"></span><span id="running-text">Building…</span></a>
  <button class="dice" id="dice" type="button" hidden title="Roll a new color scheme"><span>New colors</span></button>
  <div class="foot" id="foot"></div>
</aside>
<main id="view" tabindex="-1"></main>
<div id="curl" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="folio" aria-hidden="true"></div>
<!-- Opening: a small P on paper over a receding line grid. The I of PRIO (yellow, with a red dot) shoots up out of the
     P's counter and lands far back on the ground; it skips forward toward you, leaving C O N N E C T behind it, and the word
     stands up and fills the screen as the app arrives (renderer/intro.js). Any key or click skips it; Calm skips it; Off
     shows nothing. -->
<div id="splash" class="rk" role="region" aria-label="Prio Connect opening">
  <div class="rk-floor"></div>
  <div class="rk-stage">
    <div class="rk-i"><span class="rk-trail"></span></div>
    <svg class="rk-p" viewBox="0 0 304 383" aria-hidden="true"><rect width="87" height="383" rx="43.5" fill="#2656D9"/><path fill-rule="evenodd" fill="#E22622" d="M174 0a130 130 0 1 0 0 260a130 130 0 1 0 0-260ZM174 79a51 51 0 1 1 0 102a51 51 0 1 1 0-102Z"/><path class="prio-star" fill="#FAC800" d="M63 96C66 119 74 127 97 130C74 133 66 141 63 164C60 141 52 133 29 130C52 127 60 119 63 96Z"/></svg>
    <div class="rk-word" aria-hidden="true">PR<span class="gap">I</span>O</div>
  </div>
  <button type="button" class="rk-skip">Skip opening</button>
</div>
</body>
</html>
